<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal App Runner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>Universal App Runner</h1>
    <p>Ejecuta aplicaciones en un entorno remoto aislado, sin instalar dependencias en tu dispositivo.</p>
    <input id="file" type="file" accept=".exe,.apk">
    <button id="upload">Subir archivo</button>
    <div id="status">Estado: esperando archivo...</div>
    <progress id="progress" value="0" max="100" hidden></progress>
    <div id="session"></div>
    <div id="screen">La pantalla remota aparecerá aquí cuando el streaming esté implementado.</div>
  </main>
  <script src="/static/config.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
