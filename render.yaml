services:
  - type: web
    name: universal-app-runner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: RUNNER_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: ANDROID_RUNNER_URL
        sync: false
      - key: ANDROID_RUNNER_TOKEN
        sync: false
