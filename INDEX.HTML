<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f19">
  <title>Universal App Runner</title>
  
  <!-- Fuente Google Inter para legibilidad premium -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(18, 24, 38, 0.7);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-card-hover: rgba(99, 102, 241, 0.3);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --success: #10b981;
      --radius-lg: 16px;
      --radius-md: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 65%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
      background-attachment: fixed;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    .app-shell {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-card);
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.12);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.25);
      text-transform: uppercase;
    }

    .view {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #38bdf8;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: -16px;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: -16px;
      font-weight: 400;
    }

    .panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      transition: var(--transition);
    }

    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 20px;
      border: 2px dashed rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.015);
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      position: relative;
    }

    .dropzone:hover, .dropzone.drag-over {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.05);
      transform: translateY(-2px);
    }

    .upload-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.1);
      color: var(--primary);
      font-size: 1.4rem;
      margin-bottom: 12px;
      transition: var(--transition);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .dropzone:hover .upload-icon {
      transform: scale(1.1);
      background: var(--primary);
      color: #fff;
    }

    .drop-title {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .drop-hint {
      font-size: 0.825rem;
      color: var(--text-muted);
    }

    .dropzone input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }

    #upload {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    #upload:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    #upload:active:not(:disabled) {
      transform: translateY(0);
    }

    #upload:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.5);
      box-shadow: none;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    #status {
      font-weight: 500;
    }

    #session {
      font-family: monospace;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 4px;
      color: #38bdf8;
      font-size: 0.8rem;
    }

    /* Estilo personalizado para la barra de progreso */
    progress {
      width: 100%;
      height: 6px;
      appearance: none;
      -webkit-appearance: none;
      border: none;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }

    progress::-webkit-progress-bar {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
    }

    progress::-webkit-progress-value {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    progress::-moz-progress-bar {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
    }

    #screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #030712;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Cuadrícula de fondo técnica sutil para el visor */
    #screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    .screen-placeholder {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 1;
    }

    .screen-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-dim);
      transition: var(--transition);
    }

    /* Estado activo con animación de pulso cuando se inicia la transmisión */
    #screen.active .screen-dot {
      background-color: var(--success);
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }

    #screen.active .screen-placeholder {
      color: var(--text-muted);
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 12px;
    }

    @media (max-width: 640px) {
      .app-shell {
        gap: 20px;
      }
      .panel {
        padding: 18px;
      }
      .dropzone {
        padding: 24px 12px;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">U</span>
        <span>Universal App Runner</span>
      </div>
      <span class="badge">PRIVATE</span>
    </header>

    <section id="app-view" class="view">
      <div>
        <p class="eyebrow">REMOTE APP RUNNER</p>
        <h1 style="margin-top: 10px;">Ejecuta tus apps desde el navegador.</h1>
        <p class="subtitle" style="margin-top: 8px;">Sube un EXE o APK para crear una sesión remota.</p>
      </div>

      <section class="panel">
        <label class="dropzone" for="file" id="dropzone-area">
          <span class="upload-icon">↑</span>
          <span class="drop-title">Selecciona un archivo</span>
          <span class="drop-hint">EXE o APK</span>
          <input id="file" type="file" accept=".exe,.apk">
        </label>

        <button id="upload" type="button" disabled>Subir archivo</button>

        <div class="status-row">
          <span id="status">Listo para comenzar</span>
          <span id="session"></span>
        </div>

        <progress id="progress" value="0" max="100" hidden></progress>
      </section>

      <section id="screen">
        <div class="screen-placeholder">
          <span class="screen-dot"></span>
          <span>La pantalla remota aparecerá aquí</span>
        </div>
      </section>
    </section>

    <footer>Runner privado · Sin contraseña</footer>
  </main>

  <!-- Scripts estáticos opcionales originales preservados -->
  <script src="/static/config.js" onerror="console.log('Config no cargado (modo standalone)')"></script>
  <script src="/static/app.js" onerror="console.log('App JS estático no cargado (modo standalone)')"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const fileInput = document.getElementById('file');
      const uploadBtn = document.getElementById('upload');
      const dropTitle = document.querySelector('.drop-title');
      const dropHint = document.querySelector('.drop-hint');
      const dropzoneArea = document.getElementById('dropzone-area');
      const statusText = document.getElementById('status');
      const sessionText = document.getElementById('session');
      const progressBar = document.getElementById('progress');
      const screenView = document.getElementById('screen');

      // Gestión de selección de archivos
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          dropTitle.textContent = file.name;
          dropHint.textContent = `Tamaño: ${(file.size / (1024 * 1024)).toFixed(2)} MB`;
          uploadBtn.disabled = false;
          statusText.textContent = "Archivo listo para subir";
        }
      });

      // Manejo del evento Drag and Drop visual
      ['dragenter', 'dragover'].forEach(eventName => {
        dropzoneArea.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropzoneArea.classList.add('drag-over');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropzoneArea.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropzoneArea.classList.remove('drag-over');
        }, false);
      });

      // Simulación de proceso de subida
      uploadBtn.addEventListener('click', () => {
        if (!fileInput.files.length) return;

        uploadBtn.disabled = true;
        progressBar.hidden = false;
        progressBar.value = 0;
        statusText.textContent = "Iniciando carga de paquete...";
        
        // Generar ID de sesión simulada
        const sessionId = "sess_" + Math.random().toString(36).substring(2, 9);
        sessionText.textContent = sessionId;

        let progress = 0;
        const interval = setInterval(() => {
          progress += 5;
          progressBar.value = progress;

          if (progress === 30) {
            statusText.textContent = "Analizando ejecutable / entorno...";
          } else if (progress === 70) {
            statusText.textContent = "Asignando contenedor virtual remoto...";
          } else if (progress >= 100) {
            clearInterval(interval);
            statusText.textContent = "Sesión iniciada con éxito";
            
            // Activar simulación de pantalla remota
            screenView.classList.add('active');
            screenView.querySelector('.screen-placeholder span:last-child').textContent = "Streaming en vivo activo - Esperando entrada...";
          }
        }, 100);
      });
    });
  </script>
</body>
</html>
